[package]
name = "xiaohong-agent-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "AI-assisted, policy-checked task orchestration runtime for Xiaohong on OpenHarmony"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
